<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unity Web Player | {{{ PRODUCT_NAME }}}</title>

    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">

    #if SHOW_DIAGNOSTICS
    <link rel="stylesheet" href="<<<TemplateData/diagnostics.css>>>">
    <script src="<<<TemplateData/diagnostics.js>>>"></script>
    #endif

    #if DEVELOPMENT_PLAYER
    <script src="<<<TemplateData/profiler.js>>>"></script>
    #endif

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #101820;
        }

        #unity-container.unity-desktop {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        #unity-canvas {
            display: block;
        }

        #unity-footer {
            height: 38px;
            color: white;
        }

        #unity-build-title {
            max-width: calc(100% - 100px);
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        #unity-fullscreen-button {
            cursor: pointer;
        }

        #unity-canvas:fullscreen {
            width: 100vw !important;
            height: 100vh !important;
        }
    </style>
</head>

<body>
<div id="unity-container" class="unity-desktop">
    <canvas
            id="unity-canvas"
            width={{{ WIDTH }}}
            height={{{ HEIGHT }}}
            tabindex="-1">
    </canvas>

    <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
            <div id="unity-progress-bar-full"></div>
        </div>
    </div>

    <div id="unity-warning"></div>

    <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div
                id="unity-fullscreen-button"
                role="button"
                tabindex="0"
                aria-label="Enter fullscreen">
        </div>

        #if SHOW_DIAGNOSTICS
        <img
                id="diagnostics-icon"
                src="TemplateData/webmemd-icon.png"
                alt="Diagnostics">
        #endif

        <div id="unity-build-title">{{{ PRODUCT_NAME }}}</div>
    </div>
</div>

<script>
    var canvas = document.querySelector("#unity-canvas");

    function unityShowBanner(message, type) {
        var warningBanner = document.querySelector("#unity-warning");

        function updateBannerVisibility() {
            warningBanner.style.display =
                warningBanner.children.length ? "block" : "none";
        }

        var messageElement = document.createElement("div");
        messageElement.textContent = message;
        warningBanner.appendChild(messageElement);

        if (type === "error") {
            messageElement.style.cssText =
                "background: red; padding: 10px;";
        } else {
            if (type === "warning") {
                messageElement.style.cssText =
                    "background: yellow; padding: 10px;";
            }

            setTimeout(function () {
                messageElement.remove();
                updateBannerVisibility();
            }, 5000);
        }

        updateBannerVisibility();
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";

    var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",

        #if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
        #endif

        #if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
        #endif

        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
    productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
    productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
    showBanner: unityShowBanner,
    };

    var isMobile =
        /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

    function resizeGame() {
        if (isMobile || document.fullscreenElement) return;

        var container = document.querySelector("#unity-container");
        var footer = document.querySelector("#unity-footer");

        if (!container || !canvas) return;

        var footerHeight = footer ? footer.offsetHeight : 0;
        var availableHeight = Math.max(
            1,
            window.innerHeight - footerHeight
        );

        var width = Math.min(
            window.innerWidth,
            availableHeight * 16 / 9
        );
        var height = width * 9 / 16;

        container.style.width = width + "px";
        container.style.height = (height + footerHeight) + "px";

        canvas.style.width = width + "px";
        canvas.style.height = height + "px";
    }

    function onFullscreenChange() {
        requestAnimationFrame(resizeGame);
    }

    if (isMobile) {
        document.querySelector("#unity-container").className =
            "unity-mobile";
        canvas.className = "unity-mobile";

        #if SHOW_DIAGNOSTICS
        var diagnosticsIcon =
            document.getElementById("diagnostics-icon");
        diagnosticsIcon.style.position = "fixed";
        diagnosticsIcon.style.bottom = "10px";
        diagnosticsIcon.style.right = "0px";
        canvas.after(diagnosticsIcon);
        #endif

    } else {
        window.addEventListener("resize", resizeGame);
        document.addEventListener(
            "fullscreenchange",
            onFullscreenChange
        );

        resizeGame();
    }

    #if BACKGROUND_FILENAME
    canvas.style.background =
        "url('" + buildUrl +
        "/{{{ BACKGROUND_FILENAME.replace(/'/g, '%27') }}}')" +
        " center / cover";
    #endif

    document.querySelector("#unity-loading-bar").style.display =
        "block";

    var script = document.createElement("script");
    script.src = loaderUrl;

    script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
            document.querySelector("#unity-progress-bar-full")
                .style.width = (100 * progress) + "%";
        }).then(function (unityInstance) {
            document.querySelector("#unity-loading-bar")
                .style.display = "none";

            resizeGame();

            #if SHOW_DIAGNOSTICS
            document.getElementById("diagnostics-icon").onclick =
                function () {
                    unityDiagnostics.openDiagnosticsDiv(
                        unityInstance.GetMetricsInfo
                    );
                };
            #endif

            var fullscreenButton =
                document.querySelector("#unity-fullscreen-button");

            fullscreenButton.onclick = function () {
                unityInstance.SetFullscreen(1);
            };

            fullscreenButton.onkeydown = function (event) {
                if (event.key === "Enter" || event.key === " ") {
                    event.preventDefault();
                    unityInstance.SetFullscreen(1);
                }
            };

            #if DEVELOPMENT_PLAYER
            var profile = unityProfiler.createButton(unityInstance);
            profile.style.marginLeft = "5px";
            document.querySelector("#unity-build-title")
                .appendChild(profile);

            var quit = document.createElement("button");
            quit.style.cssText =
                "margin-left: 5px; background-color: lightgray;" +
                "border: none; padding: 5px; cursor: pointer;";
            quit.textContent = "Unload";

            document.querySelector("#unity-build-title")
                .appendChild(quit);

            quit.onclick = function () {
                unityInstance.Quit().then(function () {
                    window.removeEventListener("resize", resizeGame);
                    document.removeEventListener(
                        "fullscreenchange",
                        onFullscreenChange
                    );

                    unityProfiler.shutDown();

                    document.querySelector("#unity-container").remove();
                    canvas = null;

                    script.remove();
                    script = null;
                });
            };
            #endif

        }).catch(function (message) {
            unityShowBanner(String(message), "error");
        });
    };

    script.onerror = function () {
        unityShowBanner(
            "The game loader could not be downloaded. Please reload the page.",
            "error"
        );
    };

    document.body.appendChild(script);
</script>
</body>
</html>
